<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#2D150B" />
      <stop offset="55%" stop-color="#140A05" />
      <stop offset="100%" stop-color="#080402" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB300" />
      <stop offset="50%" stop-color="#FF5A00" />
      <stop offset="100%" stop-color="#D83B01" />
    </linearGradient>
    <linearGradient id="neonOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#FF3E00" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000000" flood-opacity="0.8" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Arrière-plan ambiance restaurant chaleureux -->
  <rect width="1200" height="800" fill="url(#bgGlow)" />
  
  <!-- Halos et particules d'ambiance -->
  <circle cx="600" cy="400" r="320" fill="#FF5A00" opacity="0.12" filter="url(#glow)" />
  <circle cx="350" cy="280" r="180" fill="#FFB300" opacity="0.08" filter="url(#glow)" />
  <circle cx="850" cy="480" r="220" fill="#E63946" opacity="0.09" filter="url(#glow)" />

  <!-- Éléments graphiques culinaires au centre -->
  <g transform="translate(600, 360)" filter="url(#shadow)">
    <!-- Assiette / Planche de présentation gourmet -->
    <ellipse cx="0" cy="140" rx="340" ry="110" fill="#1C1412" stroke="#3D2923" stroke-width="4" />
    <ellipse cx="0" cy="140" rx="310" ry="95" fill="#160F0E" />

    <!-- Ailes de poulet caramélisées / Wings croustillants -->
    <path d="M-140,90 Q-160,20 -100,-10 Q-30,-20 0,40 Q-30,110 -140,90 Z" fill="#D9531E" />
    <path d="M-125,75 Q-140,25 -95,5 Q-40,-5 -15,40" fill="#B23B10" opacity="0.7" />
    
    <path d="M20,60 Q80,-40 150,-10 Q190,40 120,110 Q50,110 20,60 Z" fill="#E65C00" />
    <path d="M40,55 Q90,-25 140,0 Q170,40 110,95" fill="#C44300" opacity="0.6" />

    <!-- Aile centrale dorée & croustillante -->
    <path d="M-60,70 Q-10,-50 70,-40 Q110,20 60,95 Q0,120 -60,70 Z" fill="url(#goldGrad)" />
    <!-- Glace / sauce brillante -->
    <ellipse cx="10" cy="20" rx="45" ry="30" fill="#FFA726" opacity="0.8" />
    <ellipse cx="25" cy="10" rx="15" ry="8" fill="#FFF3E0" opacity="0.9" />

    <!-- Saupoudrage herbes & sésame -->
    <circle cx="-15" cy="15" r="3" fill="#FFF" opacity="0.9" />
    <circle cx="35" cy="30" r="3" fill="#FFF" opacity="0.9" />
    <circle cx="-5" cy="45" r="2.5" fill="#FFF" opacity="0.85" />
    <circle cx="20" cy="-10" r="2.5" fill="#FFF" opacity="0.9" />
    <circle cx="-35" cy="5" r="3.5" fill="#2E7D32" />
    <circle cx="45" cy="15" r="3.5" fill="#2E7D32" />
    <circle cx="5" cy="55" r="3" fill="#2E7D32" />
    
    <!-- Bol de sauce spicy -->
    <ellipse cx="210" cy="70" rx="55" ry="32" fill="#E53935" />
    <ellipse cx="210" cy="68" rx="48" ry="26" fill="#B71C1C" />
    <ellipse cx="210" cy="65" rx="42" ry="20" fill="#D32F2F" />
    <circle cx="205" cy="62" r="5" fill="#FFF" opacity="0.7" />
  </g>

  <!-- Badge promotionnel "HAPPY HOUR 50% OFF" -->
  <g transform="translate(100, 110)" filter="url(#shadow)">
    <rect x="0" y="0" width="310" height="66" rx="33" fill="url(#neonOrange)" />
    <text x="155" y="42" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">★ 50% SUR TOUT ★</text>
  </g>

  <!-- Badge horaire & exclusivité -->
  <g transform="translate(860, 110)" filter="url(#shadow)">
    <rect x="0" y="0" width="240" height="54" rx="14" fill="#1E293B" stroke="#475569" stroke-width="2" />
    <text x="120" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#F8FAFC" text-anchor="middle">16h30 — 18h30</text>
  </g>

  <!-- Titre de l'affiche et mise en scène typographique -->
  <g transform="translate(600, 680)" filter="url(#shadow)">
    <rect x="-380" y="-55" width="760" height="110" rx="20" fill="#0F172ACC" stroke="#334155" stroke-width="1.5" />
    <text x="0" y="-12" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">HAPPY HOUR WINGS CRAZY</text>
    <text x="0" y="28" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#CBD5E1" text-anchor="middle">Ailes fumées marinées &amp; croustillantes • Offre limitée</text>
  </g>
</svg>
