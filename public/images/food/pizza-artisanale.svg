<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgPizza" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#2A1B14" />
      <stop offset="60%" stop-color="#140E0A" />
      <stop offset="100%" stop-color="#050302" />
    </radialGradient>
    <linearGradient id="crustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <filter id="shadowP" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="28" flood-color="#000000" flood-opacity="0.85" />
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bgPizza)" />
  <circle cx="600" cy="380" r="280" fill="#EA580C" opacity="0.12" />

  <!-- Pizza au feu de bois -->
  <g transform="translate(600, 360)" filter="url(#shadowP)">
    <!-- Planche de bois -->
    <ellipse cx="0" cy="80" rx="360" ry="160" fill="#451A03" stroke="#78350F" stroke-width="5" />
    <!-- Pâte croûte dorée alvéolée -->
    <ellipse cx="0" cy="70" rx="310" ry="135" fill="url(#crustGrad)" />
    <!-- Sauce tomate san marzano -->
    <ellipse cx="0" cy="68" rx="275" ry="118" fill="#DC2626" />
    <!-- Mozzarella di bufala fondue -->
    <ellipse cx="-70" cy="50" rx="60" ry="32" fill="#FEF08A" opacity="0.95" />
    <ellipse cx="80" cy="65" rx="70" ry="36" fill="#FEF08A" opacity="0.95" />
    <ellipse cx="0" cy="95" rx="55" ry="28" fill="#FEF08A" opacity="0.95" />
    <ellipse cx="-130" cy="85" rx="45" ry="24" fill="#FEF08A" opacity="0.9" />
    <ellipse cx="140" cy="45" rx="50" ry="26" fill="#FEF08A" opacity="0.9" />

    <!-- Feuilles de basilic frais -->
    <path d="M-40,40 Q-20,10 0,35 Q-15,55 -40,40 Z" fill="#15803D" />
    <path d="M60,35 Q90,15 95,45 Q75,65 60,35 Z" fill="#15803D" />
    <path d="M-80,95 Q-65,75 -45,95 Q-60,115 -80,95 Z" fill="#15803D" />
    <path d="M40,105 Q55,85 75,105 Q60,125 40,105 Z" fill="#15803D" />

    <!-- Filet d'huile d'olive & éclats de parmesan -->
    <circle cx="5" cy="40" r="4" fill="#FEF9C3" />
    <circle cx="-100" cy="55" r="3" fill="#FEF9C3" />
    <circle cx="110" cy="85" r="4" fill="#FEF9C3" />
  </g>

  <!-- Badge "FOUR À BOIS" -->
  <g transform="translate(100, 110)" filter="url(#shadowP)">
    <rect x="0" y="0" width="290" height="64" rx="32" fill="#EA580C" />
    <text x="145" y="41" font-family="system-ui, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle">★ AU FEU DE BOIS ★</text>
  </g>

  <!-- Titre -->
  <g transform="translate(600, 680)" filter="url(#shadowP)">
    <rect x="-360" y="-55" width="720" height="110" rx="20" fill="#0F172ACC" stroke="#334155" stroke-width="1.5" />
    <text x="0" y="-12" font-family="system-ui, sans-serif" font-size="38" font-weight="900" fill="#FFFFFF" text-anchor="middle">PIZZA MARGHERITA D.O.P</text>
    <text x="0" y="28" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#CBD5E1" text-anchor="middle">Mozzarella fior di latte, basilic frais &amp; huile d'olive vierge</text>
  </g>
</svg>
