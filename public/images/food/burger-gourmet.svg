<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgBurger" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="goldCheese" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FFA000" />
    </linearGradient>
    <filter id="shadowB" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="28" flood-color="#000000" flood-opacity="0.85" />
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bgBurger)" />
  <circle cx="600" cy="380" r="280" fill="#F59E0B" opacity="0.1" />

  <!-- Burger stylisé au centre -->
  <g transform="translate(600, 360)" filter="url(#shadowB)">
    <!-- Pain supérieur -->
    <path d="M-190,-40 C-190,-160 190,-160 190,-40 Z" fill="#D97706" />
    <path d="M-175,-45 C-175,-145 175,-145 175,-45 Z" fill="#F59E0B" opacity="0.3" />
    <!-- Graines de sésame -->
    <ellipse cx="-80" cy="-110" rx="6" ry="3" fill="#FEF3C7" transform="rotate(-15 -80 -110)" />
    <ellipse cx="40" cy="-120" rx="6" ry="3" fill="#FEF3C7" transform="rotate(20 40 -120)" />
    <ellipse cx="-20" cy="-85" rx="6" ry="3" fill="#FEF3C7" transform="rotate(5 -20 -85)" />
    <ellipse cx="100" cy="-80" rx="6" ry="3" fill="#FEF3C7" transform="rotate(-30 100 -80)" />

    <!-- Salade croquante -->
    <path d="M-210,-35 Q-170,-10 -130,-35 Q-90,-15 -50,-35 Q-10,-10 30,-35 Q70,-15 110,-35 Q160,-10 210,-35 L200,-15 Q150,0 100,-15 Q50,5 0,-15 Q-50,0 -100,-15 Q-150,5 -200,-15 Z" fill="#16A34A" />

    <!-- Tomate mûre -->
    <rect x="-185" y="-15" width="370" height="22" rx="10" fill="#DC2626" />

    <!-- Steak juteux grillé au feu -->
    <rect x="-195" y="10" width="390" height="50" rx="18" fill="#451A03" stroke="#290E02" stroke-width="3" />

    <!-- Cheddar coulant -->
    <path d="M-180,20 L180,20 L150,65 L110,35 L70,80 L20,35 L-40,75 L-90,35 L-140,65 Z" fill="url(#goldCheese)" />

    <!-- Pain inférieur -->
    <path d="M-185,65 C-185,75 -150,115 0,115 C150,115 185,75 185,65 Z" fill="#B45309" />
  </g>

  <!-- Badge "SPÉCIAL DU CHEF" -->
  <g transform="translate(100, 110)" filter="url(#shadowB)">
    <rect x="0" y="0" width="280" height="64" rx="32" fill="#FF5A00" />
    <text x="140" y="41" font-family="system-ui, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle">★ SIGNATURE ★</text>
  </g>

  <!-- Titre -->
  <g transform="translate(600, 680)" filter="url(#shadowB)">
    <rect x="-360" y="-55" width="720" height="110" rx="20" fill="#0F172ACC" stroke="#334155" stroke-width="1.5" />
    <text x="0" y="-12" font-family="system-ui, sans-serif" font-size="38" font-weight="900" fill="#FFFFFF" text-anchor="middle">SMASH BURGER SUPRÊME</text>
    <text x="0" y="28" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#CBD5E1" text-anchor="middle">Double cheddar affiné, compotée d'oignons &amp; frites maison</text>
  </g>
</svg>
