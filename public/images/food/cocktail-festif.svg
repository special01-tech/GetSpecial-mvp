<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgCocktail" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#3B0764" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </radialGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="shadowC" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="28" flood-color="#000000" flood-opacity="0.85" />
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bgCocktail)" />
  <circle cx="600" cy="380" r="280" fill="#EC4899" opacity="0.15" />

  <!-- Verre à Cocktail festif -->
  <g transform="translate(600, 360)" filter="url(#shadowC)">
    <!-- Pied de verre -->
    <ellipse cx="0" cy="190" rx="90" ry="18" fill="#E2E8F0" opacity="0.8" />
    <line x1="0" y1="190" x2="0" y2="40" stroke="#CBD5E1" stroke-width="10" stroke-linecap="round" />
    <!-- Calice du verre martini / spritz -->
    <path d="M-150,-100 L150,-100 L0,40 Z" fill="#F8FAFC" opacity="0.35" stroke="#FFFFFF" stroke-width="4" />
    <!-- Liquide vibrant Spritz / Cosmopolitan -->
    <path d="M-125,-75 L125,-75 L0,35 Z" fill="url(#neonPink)" opacity="0.85" />
    <!-- Rondelle d'agrume / menthe -->
    <circle cx="120" cy="-75" r="45" fill="#F59E0B" stroke="#FDE68A" stroke-width="4" />
    <path d="M120,-75 L155,-75 M120,-75 L145,-45 M120,-75 L120,-40 M120,-75 L95,-45 M120,-75 L85,-75" stroke="#FFF" stroke-width="2" />
    <!-- Paille et bulles -->
    <line x1="-30" y1="-140" x2="20" y2="20" stroke="#FFF" stroke-width="6" stroke-linecap="round" />
    <circle cx="-20" cy="-30" r="5" fill="#FFF" opacity="0.6" />
    <circle cx="30" cy="-50" r="7" fill="#FFF" opacity="0.5" />
    <circle cx="10" cy="-15" r="4" fill="#FFF" opacity="0.7" />
  </g>

  <!-- Badge "SOIRÉE & FESTIVITÉ" -->
  <g transform="translate(100, 110)" filter="url(#shadowC)">
    <rect x="0" y="0" width="310" height="64" rx="32" fill="url(#neonPink)" />
    <text x="155" y="41" font-family="system-ui, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle">★ AFTERWORK VIBE ★</text>
  </g>

  <!-- Titre -->
  <g transform="translate(600, 680)" filter="url(#shadowC)">
    <rect x="-360" y="-55" width="720" height="110" rx="20" fill="#0F172ACC" stroke="#334155" stroke-width="1.5" />
    <text x="0" y="-12" font-family="system-ui, sans-serif" font-size="38" font-weight="900" fill="#FFFFFF" text-anchor="middle">SPRITZ &amp; TAPAS SUNSET</text>
    <text x="0" y="28" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#CBD5E1" text-anchor="middle">Cocktails signatures • Ambiance DJ Set à partir de 18h</text>
  </g>
</svg>
